name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先确认使用的是最新版本，并尽量提供可复现步骤。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么，期望是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DockLens 版本
      placeholder: v0.0.2 / latest / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: DSM 7.2 / Ubuntu 24.04 / Docker 24.0.7 / amd64
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - 简单模式
        - 完整模式
        - 本地开发
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请粘贴 `docker compose logs --tail=100` 或相关错误
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issues
          required: true
        - label: 我已移除日志中的敏感信息
          required: true
